<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>只读协作 - 智单通 SmartDoc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23006aff'/><text x='16' y='22' text-anchor='middle' font-size='16' fill='white' font-family='Arial'>智</text></svg>">
<link rel="stylesheet" href="css/home.css">
<style>
body{background:#f2f3f5;}
.view-wrap{max-width:960px;margin:0 auto;padding:24px 20px 64px;}
.ro-banner{background:#e8f3ff;border:1px solid #bfdbfe;color:#1d4ed8;border-radius:8px;padding:12px 16px;font-size:14px;margin-bottom:16px;}
.card{background:#fff;border:1px solid #e5e6eb;border-radius:4px;padding:20px 24px;margin-bottom:16px;}
.card h2{font-size:16px;margin-bottom:12px;}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:14px;}
.kv .k{color:#7a8699;}
.chip{display:inline-block;background:#fff;border:1px solid #e5e6eb;border-radius:10px;padding:8px 12px;font-size:13px;margin:0 8px 8px 0;}
.chip.overdue{background:#fef2f2;border-color:#fca5a5;color:#991b1b;}
.chip.filed{background:#f0fdf4;border-color:#86efac;color:#047857;}
.chip.open{background:#e8f3ff;border-color:#bfdbfe;color:#1d4ed8;}
.note{font-size:13px;padding:8px 0;border-bottom:1px solid #f2f3f5;}
.paste{width:100%;min-height:80px;border:1px solid #e5e6eb;border-radius:8px;padding:10px 12px;font-size:13px;font-family:Consolas,monospace;margin:8px 0 12px;}
.err{color:#c24f4a;font-size:14px;}
table.cargo th,table.cargo td{border:1px solid #e5e6eb;padding:6px 8px;text-align:left;}
table.cargo th{background:#f7faff;font-size:12px;}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="index.html"><span class="brand-mark">智</span>智单通 SmartDoc</a>
    <div class="top-actions">
      <span style="font-size:13px;color:#7a8699;">只读协作 · 不可改档案</span>
      <a class="login" href="login.html">登录工作台</a>
    </div>
  </div>
</header>
<div class="view-wrap">
  <div class="ro-banner">这是只读协作页：可查看档案字段、单证清单、批注与截关状态，不能建档、出单或申报。</div>
  <div id="emptyBox" class="card" style="display:none">
    <h2>打开只读链接</h2>
    <p style="font-size:14px;color:#7a8699;">把协作链接贴到地址栏，或在此粘贴令牌 / 短码。</p>
    <textarea id="pasteToken" class="paste" placeholder="粘贴 SD1.... 令牌或带 #sd= 的链接"></textarea>
    <button class="btn btn-blue" style="height:40px;padding:0 18px;" type="button" onclick="loadPasted()">打开</button>
    <p class="err" id="emptyErr"></p>
  </div>
  <div id="packBox" style="display:none"></div>
</div>
<script src="js/pipeline.js"></script>
<script src="js/job.js"></script>
<script src="js/filing.js"></script>
<script src="js/share.js"></script>
<script>
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderPack(pack) {
  const s = pack.shipment || {};
  const meta = (window.SmartDoc && SmartDoc.FIELD_META) || [];
  const labels = (window.SmartJob && SmartJob.DOC_LABELS) || {};
  const docs = (pack.docs || Object.keys(pack.generated || {})).map(d => labels[d] || d);
  const notes = pack.notes || [];
  const revs = pack.revisions || [];
  const cut = (window.SmartFiling && SmartFiling.cutoffState(s, pack.filings || [])) || null;
  const fields = [{ key: 'ticketNo', label: '票号' }].concat(meta);
  document.getElementById('emptyBox').style.display = 'none';
  const box = document.getElementById('packBox');
  box.style.display = 'block';
  box.innerHTML = `
    <div class="card">
      <h2>票号 ${escapeHtml(pack.ticketNo || s.ticketNo || '')}</h2>
      ${cut ? `<div>
        <span class="chip">ETD ${escapeHtml(cut.etd ? SmartFiling.fmt(cut.etd) : '未填')}</span>
        <span class="chip ${cut.ams.status}">AMS ${escapeHtml(cut.ams.label)}</span>
        <span class="chip ${cut.isf.status}">ISF ${escapeHtml(cut.isf.label)}</span>
      </div>` : ''}
      <p style="margin-top:10px;font-size:13px;color:#7a8699;">校验：${escapeHtml(pack.checkSummary || '未附报告')}　单证：${escapeHtml(docs.length ? docs.join('、') : '仅档案')}</p>
    </div>
    <div class="card">
      <h2>货物档案（只读）</h2>
      <div class="kv">${fields.map(f => `<div class="k">${escapeHtml(f.label)}</div><div>${escapeHtml(s[f.key] || '')}</div>`).join('')}</div>
    </div>
    <div class="card">
      <h2>货描明细</h2>
      ${((window.SmartDoc && SmartDoc.normalizeLines(s)) || []).length ? `<table class="cargo" style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr><th>品名</th><th>HS</th><th>件数</th><th>毛重</th><th>体积</th></tr></thead><tbody>${SmartDoc.normalizeLines(s).map(l => `<tr><td>${escapeHtml(l.description)}</td><td>${escapeHtml(l.hsCode)}</td><td>${escapeHtml(l.packages)}</td><td>${escapeHtml(l.grossWeight)}</td><td>${escapeHtml(l.volume)}</td></tr>`).join('')}</tbody></table>` : '<p style="font-size:13px;color:#7a8699;">无明细行</p>'}
    </div>
    <div class="card">
      <h2>批注</h2>
      ${notes.length ? notes.map(n => `<div class="note"><strong>${escapeHtml(n.by || '')}</strong> · ${escapeHtml(n.at || '')} · ${escapeHtml(n.fieldLabel || n.field || '整票')}<div>${escapeHtml(n.text || '')}</div></div>`).join('') : '<p style="font-size:13px;color:#7a8699;">无批注</p>'}
    </div>
    <div class="card">
      <h2>字段修订（只读，不能回滚）</h2>
      ${revs.length ? revs.map(r => `<div class="note"><strong>${escapeHtml(r.label || r.key)}</strong> · ${escapeHtml(r.by || '')} · ${escapeHtml(r.at || '')}<div>${escapeHtml(r.from || '（空）')} → ${escapeHtml(r.to || '（空）')}</div></div>`).join('') : '<p style="font-size:13px;color:#7a8699;">无修订记录</p>'}
    </div>
    <div class="card">
      <h2>申报回执</h2>
      ${(pack.filings || []).length ? (pack.filings || []).map(f => `<div class="note">${escapeHtml((f.name || f.channel) + ' · ' + (f.status || '') + ' · ' + (f.ref || ''))}${f.late ? ' · 逾时' : ''}</div>`).join('') : '<p style="font-size:13px;color:#7a8699;">尚未申报</p>'}
    </div>`;
}

function openFrom(input) {
  try {
    const pack = SmartShare.decode(input);
    renderPack(pack);
    if (location.hash.indexOf('#sd=') === 0) history.replaceState(null, '', location.pathname + location.search + location.hash);
  } catch (e) {
    document.getElementById('emptyBox').style.display = 'block';
    document.getElementById('packBox').style.display = 'none';
    document.getElementById('emptyErr').textContent = e.message || String(e);
  }
}

function loadPasted() {
  openFrom(document.getElementById('pasteToken').value || '');
}

(function init() {
  const h = location.hash || '';
  if (h.indexOf('#sd=') === 0) openFrom(h);
  else {
    document.getElementById('emptyBox').style.display = 'block';
  }
})();
</script>
</body>
</html>
